
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-two
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-two
  template:
    metadata:
      labels:
        app: microservice-two
    spec:
      containers:
        - name: microservice-two
          image: microservice-two:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: service-two-svc
spec:
  selector:
    app: microservice-two
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
