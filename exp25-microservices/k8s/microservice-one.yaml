
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservice-one
  template:
    metadata:
      labels:
        app: microservice-one
    spec:
      containers:
        - name: microservice-one
          image: microservice-one:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: service-one-svc
spec:
  selector:
    app: microservice-one
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
