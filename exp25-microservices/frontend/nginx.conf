
server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /process {
        proxy_pass http://service-one-svc:5000/process;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
